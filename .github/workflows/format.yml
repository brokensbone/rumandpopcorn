name: Formatting

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.2"
          args: "format --check"
          src: "infra"

  site-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check authored CSS and JavaScript
        run: npx --yes prettier@3.9.10 --check "rnp/assets/**/*.{css,js}" "rnp/themes/chocos/assets/{css,js}/**/*.{css,js}"
