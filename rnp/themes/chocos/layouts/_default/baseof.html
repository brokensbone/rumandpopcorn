<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
  {{ block "extrahead" . }}{{ end }}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header>
    {{ partial "header.html" . }}
  </header>
  <div class="site-shell">
    <main id="main-content" class="main-col site-main"{{ if and .IsPage (ne .Params.search false) }} data-pagefind-body{{ end }}>
      {{ block "main" . }}{{ end }}
    </main>
    <aside class="category-sidebar" aria-label="Site navigation">
      {{ partial "category-nav.html" (dict "page" . "label" "Main navigation") }}
    </aside>
  </div>
  <footer>
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
