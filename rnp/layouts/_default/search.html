{{ define "extrahead" }}
  <meta name="robots" content="noindex, follow">
  {{ with resources.Get "css/search.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous">
  {{ end }}
  {{ with resources.Get "js/search.js" | minify | fingerprint }}
    <script type="module" src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous"></script>
  {{ end }}
{{ end }}

{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <p id="search-js-message">Search needs JavaScript.</p>
  <section id="site-search" data-index-module="{{ "pagefind/pagefind.js" | relURL }}" aria-label="Site search">
    <form role="search" action="{{ .RelPermalink }}" method="get">
      <label class="visually-hidden" for="search-query">Search the site</label>
      <div class="search-controls">
        <input id="search-query" name="q" type="search" autocomplete="off" aria-describedby="search-status" disabled>
        <button type="button" id="search-clear" aria-label="Clear search" hidden disabled><span aria-hidden="true">×</span></button>
      </div>
    </form>
    <p id="search-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <button type="button" id="search-retry" hidden>Reload search</button>
    <ol id="search-results" aria-label="Search results"></ol>
    <button type="button" id="search-more" hidden>Show more results</button>
  </section>
{{ end }}
